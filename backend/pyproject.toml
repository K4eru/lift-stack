[project]
name = "lift-stack-backend"
version = "0.1.0"
description = "Backend for lift-stack, a PWA exercise app"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "pydantic-settings",
    "sqlalchemy",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx2",
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py314"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
